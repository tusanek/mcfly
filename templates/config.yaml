# Конфигурация mcfly для проекта {{PROJECT}}
project: {{PROJECT}}

schedule:
  slots: ["00:00", "04:00"]     # ночные прогоны, локальное время Mac
  tolerance_minutes: 30         # старт позже слота более чем на это время = прогон пропущен
  summary_at: "08:00"           # утренняя сводка в Telegram
  weekly_day: 7                 # недельная сводка (0.13.0): день недели, 1 — понедельник … 7 — воскресенье; 0 — без неё
  weekly_at: "19:00"            # время недельной сводки
  weekly_list: widget           # полный список завершённого за неделю (0.14.0): widget — виджетом Telegram (не принят — расширенным сообщением, потом текстом), rich, text, off — не присылать
  answers_every_minutes: 10      # опрос ответов и кнопок из Telegram (0 — выключен)

run:
  max_minutes: 180              # жёсткий лимит одного прогона
  network_retries: 6            # повторы при отсутствии доступа к API (упал VPN или сеть)
  network_retry_minutes: 10     # пауза между повторами
  min_retry_minutes: 30         # повтор не запускается, если после паузы до конца max_minutes останется меньше
  telegram_start: true          # «запусти» боту mcfly стартует дневной прогон
  vpn_service: ""               # macOS: имя VPN из scutil --nc list — runner поднимет его перед прогоном и перед повтором
  permission_mode: auto         # auto | dontAsk | acceptEdits | bypassPermissions | default | plan
  model: ""                     # пусто = модель Claude Code по умолчанию
  max_budget_usd: 0             # 0 = без ограничения (оценка стоимости; на подписке не списывается)
  claude_bin: claude
  lead_agent: "mcfly:lead"
  extra_args: []
  # Команды проекта, которые проверка разрешений отклоняет, а команде они нужны (0.22.0), например сборка в рабочей копии.
  # Только узкие правила: Bash(<команда с подкомандой> …); Bash(*) и Bash(npm *) не принимаются.
  # allow: ["Bash(npm run build --prefix *)"]

escalation:
  answer_deadline_hours: 24     # потом действует ответ по умолчанию
  approval_deadline_hours: 24   # потом авто-одобрение изменения
  categories:
    spec:   { label: "Спецификация и критерии приёмки", auto_default: true }
    deps:   { label: "Внешние зависимости и платные ресурсы", auto_default: true }
    prod:   { label: "Прод-сервер, секреты, доступы", auto_default: false }
    budget: { label: "Бюджет и расписание", auto_default: true }
    stuck:  { label: "Два неудачных подхода подряд", auto_default: true }

telegram:
  chat_id: ""                   # заполняет команда: mcfly telegram pair
  token_env: MCFLY_TELEGRAM_TOKEN

limits:
  max_changes_per_run: 2        # изменений за дневной прогон (и за ночной, если max_changes_night: 0)
  max_changes_night: 5          # изменений за ночной прогон по расписанию (0.16.0); 0 — как max_changes_per_run
  max_tasks_per_change: 10
  followups_per_run: 3          # доделок без одобрения за прогон (0.17.0): мелкие хвосты к уже сделанному, сверх ваших задач; 0 — выключено
  run_choices: [1, 3, 5]        # на «запусти» бот спрашивает, сколько изменений взять (0.16.0); [] — без вопроса, берёт max_changes_per_run

# Список предложений в боте «💡 Предложения» (0.7.0): ваш бэклог и идеи команды, кнопки «Берём» / «Не сейчас».
# enabled: false — прежнее поведение: без одобренной работы команда планирует изменения сама.
ideas:
  enabled: true
  backlog: ""                   # где ваш бэклог, например "SHARED-UNDERSTANDING.md §4.1"; пусто — только идеи команды и ваши заметки
  per_run: 2                    # новых пунктов за обычный прогон
  per_idle_run: 4               # за прогон без работы
  show: 7                       # пунктов на экране «Предложения»
  research: true                # искать, как делают похожие системы (интернет)
  fast_edits: true              # быстрый путь и для мелкой правки существующего видимого (0.17.0): формулировка, подсказка, цвет — по пункту S;
                                # новые кнопки, экраны, сообщения и поведение по-прежнему ждут вашей кнопки с образцом
  plan_ahead: 1                 # сколько готовых планов держать на одобрении: 3 — одобряете пачкой, прогоны идут цепочкой
  fast_sizes: [S, M]            # быстрый путь (0.16.0): план по взятому пункту такого размера, который не меняет видимое, одобряется сразу
                                # и делается в том же прогоне; крупное и видимое ждёт вашей кнопки. [] — каждый план ждёт кнопки

# Удобство интерфейса (0.10.0). Навыки Claude Code, которыми дизайнер и разработчик пользуются в задачах с интерфейсом;
# ставите их вы сами (в ~/.claude/skills или в .claude/skills проекта), mcfly doctor проверит, что они на месте.
design:
  skills: []                    # например [impeccable]

# Общие папки для worktree команды (0.18.0). Claude Code создаёт worktree разработчика без неотслеживаемых файлов:
# зависимостей (node_modules и т. п.) там нет. Перечисленные папки ставятся один раз в основном каталоге,
# а разработчик подключает их ссылками командой mcfly worktree link.
worktree:
  shared: []                    # например [miniapp/node_modules]

# Снимки образцов (0.20.0): mcfly samples shoot снимает design/samples/<изменение>/NN.html в картинки.
# Браузер находится сам (Google Chrome, иначе Chromium Playwright); другой — путём ниже, только из /Applications, /usr/bin или /opt/google.
# dark: false — снимать только светлую тему (0.20.1, экономия); по умолчанию снимаются обе, если образец знает тёмную.
# samples:
#   browser: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
#   dark: false

# Стенд для сверки вида (0.22.0): команда запускает локальный сервер проекта, порт — в переменной $PORT.
# Агенты поднимают его командой mcfly stand start и гасят mcfly stand stop; после прогона mcfly гасит сам.
# stand:
#   command: "npm run dev --prefix web -- --port $PORT"
#   port: 8791

# Действия владельца кнопками в Telegram (0.6.0) — по желанию; см. README «Действия владельца в Telegram»
# actions:
#   deploy:
#     title: "🚀 Выкатить"
#     describe: "что будет сделано"
#     run: "bash ~/deploy/deploy.sh"

# Сводка коротким роликом с голосом (0.12.0) — по желанию; текст сводки приходит как раньше, ролик — следом отдельным сообщением.
# Один раз на Mac: mcfly video setup (сборщик роликов и озвучка, около 2 ГБ). Не собрался — в чат придёт одна строка, текст уже у вас.
video:
  enabled: false
  voice: eugene                 # aidar, baya, kseniya, eugene, xenia
  voice_speed: 1.1              # скорость голоса: от 0.9 до 1.3
  max_seconds: 60               # примерная длина утреннего ролика
  weekly_max_seconds: 120       # примерная длина недельного: чем длиннее, тем больше новых возможностей показано отдельно
  timeout_minutes: 15           # сколько ждать режиссёра и сборку вместе
  director: review              # кто пишет сценарий: off — код, on — роль-режиссёр, review — режиссёр и зритель (лучше, но дороже)
  director_minutes: 8           # сколько ждать режиссёра и зрителя; не уложились — ролик соберёт код
  viewer_model: claude-haiku-5-5  # модель зрителя: лёгкой хватает, чтобы поймать выдумку; пусто — модель роли
  pronounce: {}                 # иностранные слова диктор пропускает; чтобы читал: { myapp: "май +апп" } — «+» перед ударной гласной

# Находки для доработки самого mcfly (0.11.0): команда и сессии Claude записывают проблемы mcfly (не проекта),
# вы решаете в боте — «Передать» или «Не надо»; переданное дописывается в общий ящик доработки mcfly.
findings:
  enabled: true
  inbox: "~/mcfly-inbox.md"     # общий ящик для всех ваших проектов
